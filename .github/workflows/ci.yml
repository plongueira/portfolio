name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Misma imagen que compose.yaml y release.yml.
    container: node:26-bookworm-slim
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - run: npm ci
      - run: npm run build
